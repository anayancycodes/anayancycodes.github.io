# ============================================================
#  Hugo configuration for anayancycodes.github.io
#  Theme: PaperMod  (https://github.com/adityatelange/hugo-PaperMod)
#  Most things you'll want to edit are marked with  # EDIT
# ============================================================

baseURL = "https://anayancycodes.github.io/"
languageCode = "en-us"
title = "Anayancy Ramos"                       # EDIT: site title (browser tab + header)
theme = "PaperMod"

# Pretty URLs and pagination
enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false

# Posts per page on the homepage / list pages
[pagination]
  pagerSize = 5

# Generate a search index (powers the /search/ page)
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  # EDIT: short description used for SEO / link previews
  description = "Anayancy Ramos — PhD candidate at Emory studying how Pseudomonas aeruginosa and Staphylococcus aureus compete and evolve in cystic fibrosis airway infections, combining wet-lab work with phylogenetics and bioinformatics."
  author = "Anayancy Ramos"                    # EDIT: your name
  orcid = "0000-0003-2275-0956"                # your ORCID iD (powers the Publications page)
  defaultTheme = "auto"                        # auto | light | dark
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true                   # nice for code-heavy posts
  ShowToc = true                               # table of contents on long posts
  TocOpen = false
  ShowWordCount = true
  comments = false                             # turn on later if you add a comment system

  # ---- Favicon (rescued from your old site) ----
  [params.assets]
    favicon = "/favicon.png"
    favicon16x16 = "/favicon.png"
    favicon32x32 = "/favicon.png"
    apple_touch_icon = "/favicon.png"

  # ---- Homepage: profile mode (photo + bio + buttons) ----
  # Want a blog-style homepage instead (intro text + a feed of recent posts)?
  # Set enabled = false here and uncomment the [params.homeInfoParams] block below.
  [params.profileMode]
    enabled = true
    title = "Anayancy Ramos"
    subtitle = "I'm a microbiology PhD student at Emory. I study two bacteria, *Pseudomonas aeruginosa* and *Staphylococcus aureus*, that co-infect the lungs of people with cystic fibrosis, and how *P. aeruginosa* adapts to *S. aureus* over the course of an infection. I work at the bench and in bioinformatics. Currently an HHMI Gilliam Fellow."
    imageUrl = "/images/avatar.png"
    imageTitle = "Anayancy Ramos"
    imageWidth = 150
    imageHeight = 150
    [[params.profileMode.buttons]]
      name = "Posts"
      url = "posts"
    [[params.profileMode.buttons]]
      name = "About"
      url = "about"

  # ---- Alternative blog-style homepage (currently off) ----
  # [params.homeInfoParams]
  #   Title = "Hi, I'm Anayancy 👋"
  #   Content = "Short intro here."

  # ---- Social / profile icons (shown under the buttons) ----
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/anayancycodes"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/anayancy-ramos/"
  [[params.socialIcons]]
    name = "bluesky"
    url = "https://anayancy.bsky.social"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  # ---- Search page config (Fuse.js fuzzy search) ----
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# ---- Top navigation menu ----
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "publications"
    name = "Publications"
    url = "/publications/"
    weight = 15
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20
  [[menu.main]]
    identifier = "news"
    name = "In the News"
    url = "/news/"
    weight = 25
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40

# ---- Syntax highlighting for code blocks ----
[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
