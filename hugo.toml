# ============================================================
#  Hugo configuration for anayancycodes.github.io
#  Theme: PaperMod  (https://github.com/adityatelange/hugo-PaperMod)
#  Most things you'll want to edit are marked with  # EDIT
# ============================================================

baseURL = "https://anayancycodes.github.io/"
languageCode = "en-us"
title = "Anayancy Ramos"                       # EDIT: site title (browser tab + header)
theme = "PaperMod"

# Pretty URLs and pagination
enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false

# Posts per page on the homepage / list pages
[pagination]
  pagerSize = 5

# Generate a search index (powers the /search/ page)
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  # EDIT: short description used for SEO / link previews
  description = "Anayancy Ramos — PhD candidate at Emory studying how Pseudomonas aeruginosa and Staphylococcus aureus compete and evolve in cystic fibrosis airway infections, combining wet-lab work with phylogenetics and bioinformatics."
  author = "Anayancy Ramos"                    # EDIT: your name
  orcid = "0000-0003-2275-0956"                # your ORCID iD (powers the Publications page)
  defaultTheme = "auto"                        # auto | light | dark
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true                   # nice for code-heavy posts
  ShowToc = true                               # table of contents on long posts
  TocOpen = false
  ShowWordCount = true
  comments = false                             # turn on later if you add a comment system
  hideFooter = true                            # PaperMod's footer is replaced by layouts/_partials/extend_footer.html

  # ---- Tagline (shown in the footer, next to your name) ----
  tagline = "studying competition · practicing solidarity"

  # ---- Scrolling band under the hero ----
  # Add or remove words freely; they loop automatically.
  tickerWords = ["microbiology", "organizing", "bioinformatics", "open notebook"]

  # ============================================================
  #  HOMEPAGE HERO — the big headline block at the top.
  #  The body sections below it live in content/_index.md.
  # ============================================================
  [params.hero]
    label = "microbiologist · organizer"
    # *asterisks* mark the words shown in italic rose.
    # <br> forces the line break — keep it so the two halves stack.
    headline = "Studying *competition* in the lab.<br>Practicing *solidarity* everywhere else."
    intro = [
      "PhD student in Microbiology & Molecular Genetics at [Emory](https://biomed.emory.edu/PROGRAM_SITES/MMG/), going into my 5th year, and an [HHMI Gilliam Fellow](https://www.hhmi.org/programs/gilliam-fellows). I combine wet lab work, bioinformatics, and microbial ecology to study how bacteria adapt to each other.",
      "I'm also an advocate for undocumented and international students in STEM."
    ]
    [[params.hero.buttons]]
      name = "Read the blog"
      url  = "/posts/"
    [[params.hero.buttons]]
      name = "Organizing"
      url  = "/organizing/"
      outline = true

  # ============================================================
  #  HOMEPAGE SIDEBAR WIDGETS — edit the text below anytime.
  #  Leave a value as "" to hide that line.
  # ============================================================
  [params.widgets]
    lastUpdated = "Aug. 5, 2026"        # EDIT when you refresh "currently"

    [params.widgets.currently]
      fiction    = "*Video Palace: In Search of the Eyeless Man*"
      nonfiction = "*Feminism Is for Everybody*, bell hooks"
      podcast    = ""                    # EDIT
      song       = ""                    # EDIT

    [params.widgets.lab]
      name       = "EMERGENT"
      url        = "https://emergent.emory.edu/"
      fullName   = "Emory Bacterial Genomics & Metagenomics"
      advisor    = "Tim Read"
      advisorUrl = "https://emergent.emory.edu/"
      tags       = ["Bactopia", "R", "phylogenetics"]

    # "in the news" — a few highlights; full list lives on /news/
    [[params.widgets.news]]
      title = "Capital B — AI surveillance protest"
      url   = "https://atlanta.capitalbnews.org/emory-campus-ai-surveillance-protest/"
    [[params.widgets.news]]
      title = "Atlanta Civic Circle — DeFlock Emory"
      url   = "/press/atlanta-civic-circle-deflock-emory-2026-04-13.pdf"
    [[params.widgets.news]]
      title = "NYT — American Dreamers"
      url   = "https://www.nytimes.com/interactive/projects/storywall/american-dreamers/stories/anayancy-ramos"

  # ---- Favicon (rescued from your old site) ----
  [params.assets]
    favicon = "/favicon.png"
    favicon16x16 = "/favicon.png"
    favicon32x32 = "/favicon.png"
    apple_touch_icon = "/apple-touch-icon.png"

  # ---- Your photo (used by the homepage hero) ----
  [params.profileMode]
    imageUrl = "/images/avatar.png"
    imageTitle = "Anayancy Ramos"

  # ---- Social / profile icons (shown under the buttons) ----
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/anayancycodes"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/anayancy-ramos/"
  [[params.socialIcons]]
    name = "bluesky"
    url = "https://anayancy.bsky.social"

  # ---- Search page config (Fuse.js fuzzy search) ----
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# ---- Top navigation menu ----
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "organizing"
    name = "Organizing"
    url = "/organizing/"
    weight = 12
  [[menu.main]]
    identifier = "publications"
    name = "Publications"
    url = "/publications/"
    weight = 15
  [[menu.main]]
    identifier = "cv"
    name = "CV"
    url = "/anayancy-ramos-cv.pdf"
    weight = 22
  [[menu.main]]
    identifier = "news"
    name = "In the News"
    url = "/news/"
    weight = 25
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40

# ---- Syntax highlighting for code blocks ----
[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
