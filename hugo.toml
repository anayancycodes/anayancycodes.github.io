# ============================================================
#  Hugo configuration for anayancycodes.github.io
#  Theme: PaperMod  (https://github.com/adityatelange/hugo-PaperMod)
#  Most things you'll want to edit are marked with  # EDIT
# ============================================================

baseURL = "https://anayancycodes.github.io/"
languageCode = "en-us"
title = "Anayancy Codes"                       # EDIT: site title (browser tab + header)
theme = "PaperMod"

# Pretty URLs and pagination
enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false

# Posts per page on the homepage / list pages
[pagination]
  pagerSize = 5

# Generate a search index (powers the /search/ page)
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  # EDIT: short description used for SEO / link previews
  description = "Notes from an early-career bioinformatician learning in public — R, genomics, and the messy middle of figuring it out."
  author = "Anayancy"                          # EDIT: your name
  defaultTheme = "auto"                        # auto | light | dark
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true                   # nice for code-heavy posts
  ShowToc = true                               # table of contents on long posts
  TocOpen = false
  ShowWordCount = true
  comments = false                             # turn on later if you add a comment system

  # ---- Homepage intro (the "home-info" block above your post list) ----
  [params.homeInfoParams]
    Title = "Hi, I'm Anayancy 👋"               # EDIT
    Content = """
Early-career bioinformatician documenting the learning process — R, single-cell & genomics analysis, and honest notes from the parts that are hard.

I write mostly to teach myself out loud. If that's useful to you too, even better. Scroll down for recent posts, or start with the [About](/about/) page.
"""

  # ---- Social / profile icons (shown under the intro) ----
  # Delete any you don't use; add your real handles where marked EDIT.
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/anayancycodes"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:imusicjunki3@gmail.com"      # EDIT: maybe a dedicated/professional address
  # [[params.socialIcons]]
  #   name = "linkedin"
  #   url = "https://www.linkedin.com/in/YOUR-HANDLE/"   # EDIT then uncomment
  # [[params.socialIcons]]
  #   name = "bluesky"
  #   url = "https://bsky.app/profile/YOUR-HANDLE"       # EDIT then uncomment
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  # ---- Search page config (Fuse.js fuzzy search) ----
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# ---- Top navigation menu ----
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40

# ---- Syntax highlighting for code blocks ----
[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
